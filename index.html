<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwiftCart | E-Commerce</title>

<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-100">

<!-- NAVBAR -->
<div class="navbar bg-white shadow-md px-6">
  <div class="flex-1">
    <a class="text-2xl font-bold">SwiftCart</a>
  </div>

  <div class="flex-none hidden md:block">
    <ul class="menu menu-horizontal px-1 ">
      <li><a>Home</a></li>
      <li><a>Products</a></li>
      <li><a>About</a></li>
      <li><a>Contact</a></li>
    </ul>
  </div>

  <div class="flex-none">
    <button onclick="toggleCart()" class="btn btn-ghost">
      🛒 <span id="cart-count" class="badge badge-primary">0</span>
    </button>
  </div>
</div>

<!-- HERO -->
<div class="hero min-h-[60vh]" style="background-image:url('./assets/banner-image.png');">
  <div class="hero-overlay bg-black bg-opacity-60"></div>
  <div class="hero-content text-center text-white">
    <div>
      <h1 class="text-5xl font-bold">Best Collection For You</h1>
      <p class="py-4">Discover amazing deals everyday</p>
      <button onclick="scrollToProducts()" class="btn btn-primary">Shop Now</button>
    </div>
  </div>
</div>

<!-- FEATURES -->
<section class="py-10 text-center">
  <h2 class="text-3xl font-bold mb-6">Why Choose Us</h2>
  <div class="grid md:grid-cols-3 gap-6 px-6">
    <div class="card bg-white shadow p-6">🚚 <h3 class="font-bold">Fast Delivery</h3></div>
    <div class="card bg-white shadow p-6">💳 <h3 class="font-bold">Secure Payment</h3></div>
    <div class="card bg-white shadow p-6">🎧 <h3 class="font-bold">24/7 Support</h3></div>
  </div>
</section>

<!-- CATEGORIES -->
<section class="py-6 text-center">
  <h2 class="text-2xl font-bold mb-4">Shop by Category</h2>
  <div id="categories" class="flex flex-wrap justify-center gap-3"></div>
</section>

<!-- PRODUCTS -->
<section id="products-section" class="py-10 px-6">
  <h2 class="text-3xl font-bold text-center mb-6">All Products</h2>
  <div id="loader" class="text-center hidden">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
  <div id="products" class="grid md:grid-cols-3 gap-6"></div>
</section>

<!-- CART SIDEBAR -->
<div id="cart-sidebar" class="fixed right-0 top-0 w-80 h-full bg-white shadow-lg p-6 transform translate-x-full transition duration-300">
  <h3 class="text-xl font-bold mb-4">Your Cart</h3>
  <div id="cart-items"></div>
  <h4 class="mt-4 font-bold">Total: $<span id="total-price">0</span></h4>
</div>

<!-- MODAL -->
<dialog id="productModal" class="modal">
  <div class="modal-box">
    <div id="modal-details"></div>
    <div class="modal-action">
      <button class="btn" onclick="document.getElementById('productModal').close()">Close</button>
    </div>
  </div>
</dialog>
<!-- NEWSLETTER -->
<section class="py-16 text-center bg-base-100">
  <h2 class="text-3xl font-bold mb-4">Subscribe Newsletter</h2>
  <input type="email" placeholder="Enter your email" class="input input-bordered w-64" />
  <button class="btn btn-primary ml-2">Subscribe</button>
</section>

<!-- FOOTER -->
<footer class="bg-black text-white text-center p-4">
  © 2026 SwiftCart | All Rights Reserved
</footer>

<script src="script.js"></script>
</body>
</html>
